<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>إتمام الطلب — Atelier Noura</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>
        .checkout-page {
            max-width: 1180px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.15fr .85fr;
            gap: 25px;
        }

        .checkout-card {
            background: #fff;
            border: 1px solid #eee5de;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 18px 55px rgba(30,24,20,.07);
        }

        .checkout-card h1,
        .checkout-card h2 {
            margin-top: 0;
        }

        .checkout-form label {
            display: block;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .checkout-form input,
        .checkout-form textarea,
        .checkout-form select {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 7px;
            padding: 14px;
            border: 1px solid #ddd3ca;
            border-radius: 13px;
            background: #fff;
            font: inherit;
        }

        .checkout-form textarea {
            min-height: 110px;
            resize: vertical;
        }

        .checkout-form input:focus,
        .checkout-form textarea:focus,
        .checkout-form select:focus {
            outline: 2px solid rgba(80,60,45,.12);
            border-color: #9c8877;
        }

        .optional {
            color: #8a817a;
            font-size: 12px;
            font-weight: 400;
        }

        .delivery-box {
            padding: 16px;
            background: #faf7f4;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .checkout-total-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #eee5de;
        }

        .checkout-total-row:last-child {
            border-bottom: 0;
        }

        .checkout-total-final {
            font-size: 21px;
            font-weight: 700;
        }

        .checkout-submit {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            border: 0;
            border-radius: 14px;
            background: #211914;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .checkout-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .checkout-message {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 12px;
            background: #f7ebe4;
            color: #6e3022;
        }

        .checkout-message.show {
            display: block;
        }

        .checkout-item {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee5de;
        }

        .checkout-item:last-child {
            border-bottom: 0;
        }

        .checkout-item-image {
            width: 65px;
            height: 75px;
            object-fit: cover;
            border-radius: 12px;
            background: #eee8e1;
        }

        .checkout-item-info {
            flex: 1;
        }

        .checkout-empty {
            padding: 30px 10px;
            text-align: center;
            color: #777;
        }

        @media(max-width:850px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="site-header">

    <a class="brand" href="index.html">
        <span class="brand-mark">AN</span>

        <span>
            <b>Atelier</b> Noura
            <small>HANDMADE STUDIO</small>
        </span>
    </a>

    <nav class="nav">
        <a href="index.html">الرئيسية</a>
        <a href="products.html">المتجر</a>
        <a href="cart.html">السلة</a>
    </nav>

    <div class="actions">
        <button
            class="lang-btn"
            id="langBtn"
            type="button"
        >
            AR
        </button>

        <a class="bag" href="cart.html">
            ♡
            <span id="cartCount">0</span>
        </a>
    </div>

</header>

<main class="checkout-page">

    <div class="checkout-layout">

        <section class="checkout-card">

            <h1>إتمام الطلب</h1>

            <p>
                أدخل معلوماتك لإرسال طلبك.
            </p>

            <form
                id="checkout-form"
                class="checkout-form"
                novalidate
            >

                <label>
                    الاسم الكامل

                    <input
                        id="customer-name"
                        name="customer_name"
                        type="text"
                        autocomplete="name"
                        required
                    >
                </label>

                <label>
                    رقم الهاتف

                    <input
                        id="customer-phone"
                        name="customer_phone"
                        type="tel"
                        inputmode="tel"
                        autocomplete="tel"
                        placeholder="0550123456"
                        required
                    >
                </label>

                <label>
                    البريد الإلكتروني
                    <span class="optional">
                        (اختياري)
                    </span>

                    <input
                        id="customer-email"
                        name="customer_email"
                        type="text"
                        inputmode="email"
                        autocomplete="email"
                        placeholder="example@gmail.com — اختياري"
                    >
                </label>

                <label>
                    الولاية

                    <select
                        id="wilaya"
                        name="wilaya_code"
                        required
                    >
                        <option value="">
                            اختر الولاية
                        </option>
                    </select>
                </label>

                <div class="delivery-box">

                    <label>
                        طريقة التوصيل

                        <select
                            id="delivery-method"
                            name="delivery_method"
                            required
                        >
                            <option value="home">
                                توصيل إلى المنزل
                            </option>

                            <option value="office">
                                مكتب التوصيل
                            </option>
                        </select>
                    </label>

                </div>

                <label id="address-group">
                    العنوان

                    <textarea
                        id="address"
                        name="address"
                        placeholder="أدخل عنوان التوصيل"
                    ></textarea>
                </label>

                <label>
                    ملاحظات
                    <span class="optional">
                        (اختياري)
                    </span>

                    <textarea
                        id="notes"
                        name="notes"
                        placeholder="أي ملاحظة إضافية..."
                    ></textarea>
                </label>

                <button
                    class="checkout-submit"
                    type="submit"
                    data-submit-order
                >
                    تأكيد الطلب
                </button>

                <div
                    id="checkout-message"
                    class="checkout-message"
                ></div>

            </form>

        </section>

        <aside class="checkout-card">

            <h2>ملخص الطلب</h2>

            <div id="checkout-items">
                <div class="checkout-empty">
                    جاري تحميل السلة...
                </div>
            </div>

            <div class="checkout-total-row">
                <span>المجموع</span>
                <strong id="checkout-subtotal">
                    0 DA
                </strong>
            </div>

            <div class="checkout-total-row">
                <span>التوصيل</span>
                <strong id="checkout-delivery">
                    0 DA
                </strong>
            </div>

            <div class="checkout-total-row checkout-total-final">
                <span>الإجمالي</span>
                <strong id="checkout-total">
                    0 DA
                </strong>
            </div>

        </aside>

    </div>

</main>

<footer>
    <b>Atelier Noura</b>
    <p>Handmade in Algeria.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js?v=20260930"></script>

</body>
</html>
