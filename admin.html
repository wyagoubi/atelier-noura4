<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Owner Studio — Atelier Noura
  </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    .owner-login {
      max-width:480px;
      margin:8vh auto;
      padding:32px;
      background:#fff;
      border:1px solid rgba(30,24,20,.08);
      border-radius:28px;
      box-shadow:0 25px 70px rgba(30,24,20,.10);
    }

    .owner-login h1 {
      margin:8px 0;
      font-family:"Playfair Display",serif;
      font-size:36px;
    }

    .owner-login p {
      color:#777;
      line-height:1.8;
    }

    .owner-login label,
    .admin-form label {
      display:block;
      margin:14px 0;
      font-weight:600;
    }

    .owner-login input,
    .admin-form input,
    .admin-form textarea,
    .admin-form select,
    .admin-search {
      width:100%;
      box-sizing:border-box;
      padding:13px 15px;
      margin-top:7px;
      border:1px solid #ddd4cb;
      border-radius:12px;
      background:#fff;
      font:inherit;
    }

    .owner-login button,
    .admin-primary,
    .admin-danger,
    .admin-secondary {
      border:0;
      border-radius:12px;
      padding:13px 18px;
      cursor:pointer;
      font:inherit;
      font-weight:700;
    }

    .owner-login button,
    .admin-primary {
      background:#201914;
      color:#fff;
    }

    .admin-secondary {
      background:#f0ebe6;
      color:#201914;
    }

    .admin-danger {
      background:#9c2f2f;
      color:#fff;
    }

    .admin-message {
      margin-top:14px;
      padding:12px 14px;
      border-radius:12px;
      background:#f5eee8;
      display:none;
    }

    .admin-message.show {
      display:block;
    }

    .admin-toolbar {
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:24px;
    }

    .admin-toolbar-actions {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .admin-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    }

    .admin-card {
      background:#fff;
      border:1px solid rgba(30,24,20,.08);
      border-radius:22px;
      padding:22px;
      box-shadow:0 15px 45px rgba(30,24,20,.06);
      margin-bottom:18px;
    }

    .admin-card h2,
    .admin-card h3 {
      margin-top:0;
    }

    .product-admin-row {
      display:grid;
      grid-template-columns:90px 1fr auto;
      gap:16px;
      align-items:center;
      padding:14px 0;
      border-bottom:1px solid #eee6df;
    }

    .product-admin-row:last-child {
      border-bottom:0;
    }

    .admin-thumb {
      width:90px;
      height:105px;
      border-radius:16px;
      background:#eee8e1;
      overflow:hidden;
      display:grid;
      place-items:center;
      color:#8b8178;
      font-size:11px;
      text-align:center;
    }

    .admin-thumb img {
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .admin-meta strong {
      display:block;
      font-size:17px;
      margin-bottom:5px;
    }

    .admin-meta small {
      color:#7d746d;
    }

    .admin-actions {
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .admin-actions button,
    .upload-label {
      border:1px solid #ddd4cb;
      background:#fff;
      border-radius:10px;
      padding:9px 12px;
      cursor:pointer;
      font:inherit;
    }

    .upload-label input {
      display:none;
    }

    .admin-table-wrap {
      overflow:auto;
    }

    .admin-table {
      width:100%;
      border-collapse:collapse;
      min-width:780px;
    }

    .admin-table th,
    .admin-table td {
      padding:13px;
      border-bottom:1px solid #eee6df;
      text-align:right;
      vertical-align:top;
    }

    .admin-table th {
      font-size:13px;
      color:#7b7169;
    }

    .status-select {
      padding:8px;
      border-radius:9px;
      border:1px solid #ddd4cb;
      background:#fff;
    }

    .admin-modal {
      position:fixed;
      inset:0;
      background:rgba(24,18,14,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:1000;
    }

    .admin-modal.open {
      display:flex;
    }

    .admin-modal-box {
      width:min(720px,100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:26px;
      padding:25px;
      box-shadow:0 30px 100px rgba(0,0,0,.2);
    }

    .admin-modal-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
    }

    .admin-close {
      border:0;
      background:#eee7e1;
      width:38px;
      height:38px;
      border-radius:50%;
      cursor:pointer;
      font-size:20px;
    }

    .form-actions {
      display:flex;
      gap:10px;
      justify-content:flex-start;
      margin-top:20px;
      flex-wrap:wrap;
    }

    .empty-admin {
      padding:35px;
      text-align:center;
      color:#777;
    }

    @media(max-width:800px) {

      .admin-grid {
        grid-template-columns:1fr;
      }

      .product-admin-row {
        grid-template-columns:70px 1fr;
      }

      .product-admin-row .admin-actions {
        grid-column:1/-1;
        justify-content:flex-start;
      }

      .admin-thumb {
        width:70px;
        height:80px;
      }

    }

  </style>

</head>


<body class="admin-body">


<header class="admin-top">

  <a
    class="brand"
    href="index.html"
  >

    <span class="brand-mark">
      AN
    </span>

    <span>
      <b>Owner</b>
      Studio

      <small>
        ATELIER NOURA
      </small>
    </span>

  </a>


  <div
    style="
      display:flex;
      gap:12px;
      align-items:center
    "
  >

    <span
      id="ownerEmail"
      style="
        font-size:13px;
        color:#766d65
      "
    ></span>


    <a
      href="index.html"
      class="text-link"
    >
      ← الموقع
    </a>


    <button
      id="logoutBtn"
      class="admin-secondary"
      style="display:none"
    >
      تسجيل الخروج
    </button>

  </div>

</header>



<section
  id="loginView"
  class="owner-login"
>

  <span class="eyebrow">
    PRIVATE AREA
  </span>


  <h1>
    Owner Studio
  </h1>


  <p>

    هذه المنطقة خاصة بمالك
    Atelier Noura.

    سجّل الدخول لإدارة المنتجات
    والأسعار والصور والطلبات.

  </p>


  <form
    id="loginForm"
    class="admin-form"
  >

    <label>

      البريد الإلكتروني

      <input
        id="loginEmail"
        type="email"
        required
        autocomplete="email"
      >

    </label>


    <label>

      كلمة المرور

      <input
        id="loginPassword"
        type="password"
        required
        autocomplete="current-password"
      >

    </label>


    <button
      type="submit"
      class="admin-primary"
    >
      دخول المالك
    </button>


    <div
      id="loginMessage"
      class="admin-message"
    ></div>

  </form>

</section>



<main
  id="dashboardView"
  class="admin-shell"
  style="display:none"
>

  <aside class="admin-nav">

    <b>
      OWNER STUDIO
    </b>


    <button
      class="admin-tab active"
      data-tab="overview"
    >
      Overview
    </button>


    <button
      class="admin-tab"
      data-tab="products"
    >
      Products
    </button>


    <button
      class="admin-tab"
      data-tab="orders"
    >
      Orders
    </button>


    <button
      class="admin-tab"
      data-tab="delivery"
    >
      Delivery
    </button>


    <button
      class="admin-tab"
      data-tab="media"
    >
      Media
    </button>


    <button
      class="admin-tab"
      data-tab="settings"
    >
      Settings
    </button>

  </aside>


  <section class="admin-content">

    <div id="adminApp"></div>

  </section>

</main>



<div
  id="productModal"
  class="admin-modal"
  aria-hidden="true"
>

  <div class="admin-modal-box">


    <div class="admin-modal-head">

      <h2 id="productModalTitle">
        إضافة منتج
      </h2>


      <button
        class="admin-close"
        type="button"
        data-close-modal
      >
        ×
      </button>

    </div>


    <form
      id="productForm"
      class="admin-form"
    >

      <input
        type="hidden"
        id="productId"
      >


      <div class="admin-grid">

        <label>

          اسم المنتج بالعربية

          <input
            id="nameAr"
            required
          >

        </label>


        <label>

          Nom du produit

          <input id="nameFr">

        </label>


        <label>

          Product name

          <input id="nameEn">

        </label>


        <label>

          السعر (DA)

          <input
            id="price"
            type="number"
            min="0"
            step="0.01"
            required
          >

        </label>


        <label>

          المخزون

          <input
            id="stock"
            type="number"
            min="0"
            step="1"
            value="0"
            required
          >

        </label>


        <label>

          التصنيف

          <select
            id="categoryId"
            required
          ></select>

        </label>

      </div>



      <div class="admin-grid">

        <label>

          الوصف بالعربية

          <textarea
            id="descAr"
            rows="3"
          ></textarea>

        </label>


        <label>

          Description FR

          <textarea
            id="descFr"
            rows="3"
          ></textarea>

        </label>


        <label>

          Description EN

          <textarea
            id="descEn"
            rows="3"
          ></textarea>

        </label>

      </div>



      <label
        style="
          display:flex;
          align-items:center;
          gap:8px
        "
      >

        <input
          id="featured"
          type="checkbox"
          style="width:auto"
        >

        منتج مميز / Featured

      </label>



      <label
        style="
          display:flex;
          align-items:center;
          gap:8px
        "
      >

        <input
          id="active"
          type="checkbox"
          checked
          style="width:auto"
        >

        ظاهر في المتجر

      </label>



      <div class="form-actions">

        <button
          class="admin-primary"
          type="submit"
        >
          حفظ المنتج
        </button>


        <button
          class="admin-secondary"
          type="button"
          data-close-modal
        >
          إلغاء
        </button>

      </div>


      <div
        id="productMessage"
        class="admin-message"
      ></div>

    </form>

  </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/admin.js"></script>

</body>
</html>
