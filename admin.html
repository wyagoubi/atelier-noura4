<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Studio — Atelier Noura</title>
  <meta name="description" content="لوحة إدارة Atelier Noura للمنتجات والطلبات والمبيعات والتوصيل.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin-theme.css">
</head>
<body class="admin-body">

<section id="loginView" class="owner-login">
  <div class="owner-login-orb orb-a"></div><div class="owner-login-orb orb-b"></div><svg class="login-art" viewBox="0 0 600 700" aria-hidden="true"><path d="M20 700C120 520 90 340 300 250s300-60 290-250"/><path d="M60 700C160 540 160 400 330 320s240-80 270-200"/><path d="M300 700C300 560 360 470 470 410"/></svg>
  <div class="owner-login-panel">
    <div class="owner-login-brand"><div><b>ATELIER NOURA</b><small>OWNER STUDIO</small></div></div>
    <span class="eyebrow">PRIVATE ACCESS</span>
    <h1>الاستوديو الخاص</h1>
    <p>مساحة هادئة لإدارة متجرك، طلباتك، منتجاتك ومؤشرات المبيعات.</p>
    <form id="loginForm" class="admin-form">
      <label>البريد الإلكتروني<input id="loginEmail" type="email" required autocomplete="email"></label>
      <label>كلمة المرور (اختياري — اتركيها فارغة لإرسال رابط دخول إلى بريدك)<input id="loginPassword" type="password" autocomplete="current-password"></label>
      <button type="submit" class="admin-primary">دخول إلى الاستوديو</button>
      <div id="loginMessage" class="admin-message"></div>
    </form>
    <a href="index.html" class="owner-back">← العودة إلى المتجر</a>
  </div>
</section>

<header class="admin-top">
  <a class="brand" href="index.html"><span><b>ATELIER NOURA</b><small>Owner Studio</small></span></a>
  <div class="admin-toolbar-actions"><button id="notifBtn" class="admin-secondary bell" type="button" aria-label="الطلبات الجديدة"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16zM10 21h4"/></svg><span id="notifBadge" class="notif-badge" hidden>0</span></button><span class="owner-status"><i></i> Secure session</span><button id="ownerTheme" class="admin-secondary" type="button" aria-label="تغيير المظهر">◐</button><span id="ownerEmail" class="owner-email"></span><a href="index.html" class="text-link">← الموقع</a><button id="logoutBtn" class="admin-secondary" type="button">تسجيل الخروج</button></div>
</header>

<main id="dashboardView" class="admin-shell" style="display:none">
  <aside class="admin-nav">
    <div class="admin-nav-top"><div><b>ATELIER NOURA</b><small>OWNER STUDIO</small></div></div>
    <button class="admin-tab active" data-tab="overview" type="button"><span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg></span><span>نظرة عامة</span></button>
    <button class="admin-tab" data-tab="products" type="button"><span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></span><span>المنتجات</span></button>
    <button class="admin-tab" data-tab="categories" type="button"><span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6v6H4zM14 5h6v6h-6zM4 15h6v4H4zM14 15h6v4h-6z"/></svg></span><span>التصنيفات</span></button>
    <button class="admin-tab" data-tab="orders" type="button"><span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg></span><span>الطلبات</span></button>
    <button class="admin-tab" data-tab="delivery" type="button"><span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg></span><span>التوصيل</span></button>
    <button class="admin-tab" data-tab="media" type="button"><span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></span><span>الوسائط</span></button>
    <button class="admin-tab" data-tab="settings" type="button"><span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span><span>الإعدادات</span></button>
    <a class="admin-nav-site" href="index.html"><span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></span><span>عرض المتجر</span></a>
    <div class="admin-nav-orb"></div>
  </aside>

  <section class="admin-content">
    <div id="adminApp"></div>
  </section>
</main>

<div id="productModal" class="admin-modal" aria-hidden="true">
  <div class="admin-modal-box">
    <div class="admin-modal-head"><div><span class="eyebrow">CATALOG EDITOR</span><h2 id="productModalTitle">إضافة منتج</h2></div><button class="admin-close" type="button" data-close-modal aria-label="إغلاق">×</button></div>
    <form id="productForm" class="admin-form">
      <input type="hidden" id="productId">
      <div class="admin-grid"><label>اسم المنتج بالعربية<input id="nameAr" required></label><label>Nom du produit<input id="nameFr"></label><label>Product name<input id="nameEn"></label><label>السعر (DA)<input id="price" type="number" min="0" step="0.01" required></label><label>المخزون<input id="stock" type="number" min="0" step="1" value="0" required></label><label>التصنيف<select id="categoryId" required></select></label></div>
      <div class="admin-grid"><label>الوصف بالعربية<textarea id="descAr" rows="4"></textarea></label><label>Description FR<textarea id="descFr" rows="4"></textarea></label><label>Description EN<textarea id="descEn" rows="4"></textarea></label></div>
      <label class="check-row"><input id="featured" type="checkbox"> منتج مميز / Featured</label><label class="check-row"><input id="active" type="checkbox" checked> ظاهر في المتجر</label>
      <div class="form-actions"><button class="admin-primary" type="submit">حفظ المنتج</button><button class="admin-secondary" type="button" data-close-modal>إلغاء</button></div><div id="productMessage" class="admin-message"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/admin.js"></script><script src="js/admin-live.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
