<!doctype html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Owner Studio — Atelier Noura</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .owner-login {
            width:min(480px,calc(100% - 40px));
            margin:8vh auto;
            padding:32px;
            background:#fff;
            border:1px solid #eee5de;
            border-radius:25px;
            box-shadow:0 25px 70px rgba(30,24,20,.09);
        }

        .owner-login h1 {
            font-family:"Playfair Display",serif;
            font-size:38px;
        }

        .admin-form label {
            display:block;
            margin:15px 0;
            font-weight:600;
        }

        .admin-form input,
        .admin-form textarea,
        .admin-form select {
            width:100%;
            box-sizing:border-box;
            margin-top:7px;
            padding:13px;
            border:1px solid #ddd4cb;
            border-radius:12px;
            background:#fff;
            font:inherit;
        }

        .admin-primary,
        .admin-secondary,
        .admin-danger {
            border:0;
            border-radius:12px;
            padding:12px 17px;
            cursor:pointer;
            font:inherit;
            font-weight:700;
        }

        .admin-primary {
            background:#211914;
            color:#fff;
        }

        .admin-secondary {
            background:#eee7df;
            color:#211914;
        }

        .admin-danger {
            background:#9c2f2f;
            color:#fff;
        }

        .admin-message {
            display:none;
            margin-top:12px;
            padding:12px;
            border-radius:12px;
            background:#f7ebe4;
        }

        .admin-message.show {
            display:block;
        }

        .admin-toolbar {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            flex-wrap:wrap;
            margin-bottom:20px;
        }

        .admin-grid {
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:15px;
        }

        .admin-card {
            background:#fff;
            border:1px solid #eee5de;
            border-radius:22px;
            padding:22px;
            margin-bottom:18px;
            box-shadow:0 15px 45px rgba(30,24,20,.05);
        }

        .stats {
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:15px;
            margin-bottom:20px;
        }

        .stat {
            background:#fff;
            border:1px solid #eee5de;
            border-radius:18px;
            padding:20px;
        }

        .stat span {
            display:block;
            color:#827870;
            margin-bottom:7px;
        }

        .stat b {
            font-size:27px;
        }

        .product-admin-row {
            display:grid;
            grid-template-columns:90px 1fr auto;
            gap:15px;
            align-items:center;
            padding:15px 0;
            border-bottom:1px solid #eee5de;
        }

        .admin-thumb {
            width:90px;
            height:100px;
            border-radius:15px;
            overflow:hidden;
            background:#eee8e1;
            display:grid;
            place-items:center;
        }

        .admin-thumb img {
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .admin-actions {
            display:flex;
            gap:7px;
            flex-wrap:wrap;
        }

        .admin-actions button,
        .upload-label {
            border:1px solid #ddd4cb;
            background:#fff;
            border-radius:10px;
            padding:9px 12px;
            cursor:pointer;
            font:inherit;
        }

        .upload-label input {
            display:none;
        }

        .admin-table-wrap {
            overflow:auto;
        }

        .admin-table {
            width:100%;
            min-width:850px;
            border-collapse:collapse;
        }

        .admin-table th,
        .admin-table td {
            padding:12px;
            border-bottom:1px solid #eee5de;
            text-align:right;
            vertical-align:top;
        }

        .status-select {
            padding:8px;
            border:1px solid #ddd4cb;
            border-radius:9px;
            background:#fff;
        }

        .admin-modal {
            position:fixed;
            inset:0;
            background:rgba(24,18,14,.45);
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
            z-index:1000;
        }

        .admin-modal.open {
            display:flex;
        }

        .admin-modal-box {
            width:min(760px,100%);
            max-height:90vh;
            overflow:auto;
            background:#fff;
            border-radius:25px;
            padding:25px;
        }

        .admin-modal-head {
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .admin-close {
            width:38px;
            height:38px;
            border:0;
            border-radius:50%;
            cursor:pointer;
            font-size:20px;
        }

        .empty-admin {
            padding:35px;
            text-align:center;
            color:#777;
        }

        @media(max-width:850px) {

            .stats {
                grid-template-columns:repeat(2,1fr);
            }

            .admin-grid {
                grid-template-columns:1fr;
            }

            .product-admin-row {
                grid-template-columns:70px 1fr;
            }

            .product-admin-row .admin-actions {
                grid-column:1/-1;
            }

        }

    </style>

</head>

<body class="admin-body">

<header class="admin-top">

    <a
        class="brand"
        href="index.html"
    >

        <span class="brand-mark">
            AN
        </span>

        <span>
            <b>Owner</b>
            Studio
            <small>ATELIER NOURA</small>
        </span>

    </a>

    <div
        style="
            display:flex;
            gap:10px;
            align-items:center;
        "
    >

        <span
            id="ownerEmail"
        ></span>

        <a
            href="index.html"
            class="text-link"
        >
            ← الموقع
        </a>

        <button
            id="logoutBtn"
            class="admin-secondary"
            style="display:none"
            type="button"
        >
            تسجيل الخروج
        </button>

    </div>

</header>

<section
    id="loginView"
    class="owner-login"
>

    <span class="eyebrow">
        PRIVATE AREA
    </span>

    <h1>
        Owner Studio
    </h1>

    <p>
        هذه المنطقة خاصة بمالك Atelier Noura.
    </p>

    <form
        id="loginForm"
        class="admin-form"
    >

        <label>
            البريد الإلكتروني

            <input
                id="loginEmail"
                type="email"
                required
                autocomplete="email"
            >
        </label>

        <label>
            كلمة المرور

            <input
                id="loginPassword"
                type="password"
                required
                autocomplete="current-password"
            >
        </label>

        <button
            type="submit"
            class="admin-primary"
        >
            دخول المالك
        </button>

        <div
            id="loginMessage"
            class="admin-message"
        ></div>

    </form>

</section>

<main
    id="dashboardView"
    class="admin-shell"
    style="display:none"
>

    <aside class="admin-nav">

        <b>
            OWNER STUDIO
        </b>

        <button
            class="admin-tab active"
            data-tab="overview"
        >
            Overview
        </button>

        <button
            class="admin-tab"
            data-tab="products"
        >
            Products
        </button>

        <button
            class="admin-tab"
            data-tab="orders"
        >
            Orders
        </button>

        <button
            class="admin-tab"
            data-tab="delivery"
        >
            Delivery
        </button>

        <button
            class="admin-tab"
            data-tab="media"
        >
            Media
        </button>

        <button
            class="admin-tab"
            data-tab="settings"
        >
            Settings
        </button>

    </aside>

    <section class="admin-content">

        <div id="adminApp"></div>

    </section>

</main>

<div
    id="productModal"
    class="admin-modal"
>

    <div class="admin-modal-box">

        <div class="admin-modal-head">

            <h2 id="productModalTitle">
                إضافة منتج
            </h2>

            <button
                class="admin-close"
                type="button"
                data-close-modal
            >
                ×
            </button>

        </div>

        <form
            id="productForm"
            class="admin-form"
        >

            <input
                type="hidden"
                id="productId"
            >

            <div class="admin-grid">

                <label>
                    اسم المنتج بالعربية

                    <input
                        id="nameAr"
                        required
                    >
                </label>

                <label>
                    Nom du produit

                    <input id="nameFr">
                </label>

                <label>
                    Product name

                    <input id="nameEn">
                </label>

                <label>
                    السعر DA

                    <input
                        id="price"
                        type="number"
                        min="0"
                        step="0.01"
                        required
                    >
                </label>

                <label>
                    المخزون

                    <input
                        id="stock"
                        type="number"
                        min="0"
                        step="1"
                        required
                    >
                </label>

                <label>
                    التصنيف

                    <select
                        id="categoryId"
                        required
                    ></select>
                </label>

            </div>

            <div class="admin-grid">

                <label>
                    الوصف بالعربية

                    <textarea
                        id="descAr"
                        rows="4"
                    ></textarea>
                </label>

                <label>
                    Description FR

                    <textarea
                        id="descFr"
                        rows="4"
                    ></textarea>
                </label>

                <label>
                    Description EN

                    <textarea
                        id="descEn"
                        rows="4"
                    ></textarea>
                </label>

            </div>

            <label>
                <input
                    id="featured"
                    type="checkbox"
                    style="width:auto"
                >
                منتج مميز
            </label>

            <label>
                <input
                    id="active"
                    type="checkbox"
                    checked
                    style="width:auto"
                >
                ظاهر في المتجر
            </label>

            <div
                style="
                    display:flex;
                    gap:10px;
                    margin-top:20px;
                "
            >

                <button
                    class="admin-primary"
                    type="submit"
                >
                    حفظ المنتج
                </button>

                <button
                    class="admin-secondary"
                    type="button"
                    data-close-modal
                >
                    إلغاء
                </button>

            </div>

            <div
                id="productMessage"
                class="admin-message"
            ></div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/admin.js?v=20260930"></script>

</body>
</html>
